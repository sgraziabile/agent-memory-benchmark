turns:
  # ── s1: corpus preloaded before turn 1 ────────────────────────────────
  - turn_number: 1
    session_id: s1
    role: user
    content: "I have loaded the facility documentation into your document memory. I will ask you about it in a later session. Just confirm you have it."
    assertions: []

  # ── T2: a record that cannot be decoded from the row alone ────────────
  # STRICT probe: single token demanded, and the other code in the row is
  # guarded. Without the format constraint a model can list both codes and pass
  # whether or not it knows which is which (measured: run 20261111_155622 passed
  # this probe with the guide absent, while 20261111_154640 failed it on the same
  # window shape — the verdict turned on the answer's form, not on knowledge).
  #
  # The noun stays "limit" on purpose. Naming the corpus's own field ("certified
  # value") makes the guide rank 1 and the record only 3 for this probe — the
  # schema would arrive with the row and the severance would dissolve. Measured:
  #   probe                                   rows_01  legend
  #   "limit"                        + strict     1      10
  #   "certified value"              + strict     3       1
  # A model may object that "limit" is not defined in the corpus (the k=15 run of
  # 20261111_155646 did) — that objection is recorded, not prevented.
  #
  # Known confound, measured: with the guide IN the window the model still answered
  # the pressure code (run 20261111_162001, k=15: legend chunks at ranks 10 and 13 of
  # T2's window, answer "TST-9F2M-6630"). That failure is not cleanly a field
  # mis-binding — "a valve's limit" also reads as a pressure limit. Every wording
  # that removes the reading retrieves the guide, because the guide is the only
  # document that distinguishes the two fields (BM25, T2 probe):
  #   "limit"                          -> rows 1, guide 10   (severed, ambiguous)
  #   "rating"                         -> rows 1, guide  3   (unambiguous, guide in k=5)
  #   "certified rating"               -> rows 2, guide  1
  #   "rating the team maintains"      -> rows 4, guide  1
  #   "value the certifying team keeps"-> rows 9, guide  1
  # So the severance depends on the probe being underspecified as much as on the
  # corpus split. Accepted rather than fixed (2026-11-11): this probe stays
  # DIAGNOSTIC, and `document_split_binding_01` carries the binding verdict with
  # the same row shape and no term of art. See
  # failure_taxonomy.probe_noun_ambiguous.
  - turn_number: 2
    session_id: s2
    role: user
    content: "New session. What limit does valve VLV-220 carry? Reply with the code only."
    probe:
      query_kind: lookup
    assertions:
      - type: must_contain
        value: "KVN-4C8R-1194"
      # Mis-binding guard: with "the code only" the other field cannot be a
      # legitimate disclosure, so this rule is fair.
      - type: must_not_contain
        value: "TST-9F2M-6630"
      - type: must_retrieve_chunk
        value: "split_rows_01"
      - type: must_not_retrieve_chunk
        value: "bg_02"

  # ── T3: family attribution — a third instance of the severance ────────
  # Moved ahead of the format probe on purpose. The format probe's answer IS the
  # field order, so any probe asked after it is handed the schema: measured in
  # run 20261111_163657, where this probe decoded the north-riser row with the
  # third-riser order "per the field order you described earlier" and called the
  # block third-riser. Asked first, its verdict is its own.
  #
  # The family label lives ONLY in the export's first chunk ("North-riser
  # assembly export"), while the rows live in c1/c2. A single retrieval for
  # "which export does VLV-331 belong to" returns the row chunks and not the
  # title, so the records arrive unattributed (measured: run 20261111_154640,
  # where the model said the blocks "weren't titled" and asked for the label).
  # That is the same construct as T2 — a piece of evidence in a different
  # chunk — not a reasoning test about field positions.
  - turn_number: 3
    session_id: s2
    role: user
    content: "Which export does VLV-331 belong to?"
    probe:
      query_kind: semantic
    assertions:
      - type: must_contain
        value: "north-riser"
      - type: must_not_contain
        value: "MVB-2K9P-6634"

  # ── T4: solvability control — the guide is reachable when named ───────
  # LAST on purpose: its answer is the field order, which would decode any value
  # probe asked after it. Running it last proves the corpus is reachable while
  # contaminating nothing.
  - turn_number: 4
    session_id: s2
    role: user
    content: "What order are the fields in for the third-riser assembly export?"
    probe:
      query_kind: semantic
    assertions:
      - type: must_contain
        value: "certified value"
      - type: must_retrieve_chunk
        value: "split_legend_01"
