turns:
  # ── s1: corpus preloaded before turn 1 ────────────────────────────────
  - turn_number: 1
    session_id: s1
    role: user
    content: "I have loaded the facility documentation into your document memory. I will ask you about it in a later session. Just confirm you have it."
    assertions: []

  # ── T2: the binding probe — first question of the run, no schema in reach ──
  # Standalone wording, not "And valve VLV-247?": a probe that leans on the
  # previous turn makes the cell depend on a turn it must not have.
  #
  # This asks about a NORTH-RISER record on purpose. Measured 2026-11-11: the
  # model's default is "report the second field of the line". For the third-riser
  # export the second field IS the certified value, so a third-riser probe passes
  # at k=5 with the guide out of reach — for a positional reason, not an
  # interpretative one (run 20261111_171327, 6/6). The north-riser export puts
  # the certified value third, so the same default is wrong:
  #   third-riser  VLV-247 | KVN-… | TST-… | date  -> answered KVN-8T2D-4417  PASS (positional)
  #   north-riser  VLV-320 | TRQ-… | MVB-… | date  -> answered TRQ-HJZS-1262  FAIL (position-2)
  # With the guide in the window at k=15 it still answered TRQ-HJZS-1262, so the
  # failure is interpretation, not reachability.
  #
  # STRICT: "the code only" excludes a hedge, which is what makes the guard fair
  # (a hedge would otherwise satisfy must_contain while certifying nothing).
  # Measured: rows_02 rank 2, guide rank 18 of 37 — the record arrives, the
  # schema does not.
  - turn_number: 2
    session_id: s2
    role: user
    content: "What is the code for valve VLV-320? Reply with the code only."
    probe:
      query_kind: lookup
    assertions:
      - type: must_contain
        value: "MVB-XNJL-1944"
      - type: must_not_contain
        value: "TRQ-HJZS-1262"
      - type: must_retrieve_chunk
        value: "split_rows_02"
      # Second hop, and it belongs on THIS probe: T2's answer is not in the row —
      # the row is undecidable until the guide says which of its two codes is the
      # certified value — which is what the header above already declares
      # ("needs split_rows_02 AND split_legend_01"). Pinning only the row made
      # `retrieval_recall` read 8/8 = 100 % while the probe failed 16/24, so the
      # missing retrieval was unmetered and the failure unattributable.
      #
      # What the pin buys is the split this cell's own failure_taxonomy describes
      # in prose, now measured:
      #   recall 1/2            -> the schema never arrived. The answer is then
      #                            either a refusal (`guide_unreachable`) or a
      #                            confident positional default
      #                            (`positional_default`, which is what run
      #                            20261112_132030 produced: TRQ-HJZS-1262).
      #   recall 2/2 + T2 fails -> field_misbinding (it arrived and was misread)
      # The pin is expected to FAIL at k=5 by design — the guide ranks outside the
      # window there (`test_the_binding_probe_reaches_the_record_but_not_the_guide`)
      # and inside it at k=15 (ranks 10 and 12, per field_misbinding), so both
      # arms of the measurement exist. It is attribution, not a k=15-proof bridge:
      # breadth can still substitute for a second call here;
      # `document_multihop_bridge_01` is the cell that stays unsolved at any k.
      #
      # AS-RUN NOTE: the four runs produced before 2026-11-12 recorded this turn
      # with 2 pins, and `run_stats` prefers the run's own total over today's
      # YAML, so their `retrieval_recall` keeps the OLD denominator (as-run) and
      # does NOT raise the drift flag. They are not comparable to runs made after
      # this edit: this cell needs a re-run.
      - type: must_retrieve_chunk
        value: "split_legend_01"
      # H5 precision pin: a filler must not be pulled in alongside the row, or
      # context blending stays a text guard instead of a metric.
      - type: must_not_retrieve_chunk
        value: "bg_02"

  # ── T3: solvability control — the guide is reachable when named ───────
  # LAST on purpose: its answer is the field order, so a value probe asked after
  # it would be decodable without the corpus. Running it in the same session
  # also proves the guide was in the store all along, so a fail at T2 is not a
  # plumbing failure.
  - turn_number: 3
    session_id: s2
    role: user
    content: "What order are the fields in for the third-riser assembly export?"
    probe:
      query_kind: semantic
    assertions:
      - type: must_contain
        value: "certified value"
      - type: must_retrieve_chunk
        value: "split_legend_01"
