# ─────────────────────────────────────────────────────────────────
# test_document_dilution_01.yaml — Document Corpus Dilution
# ─────────────────────────────────────────────────────────────────
# Plan WS-D (TODOs/phase-2-l2-completion-plan.md §4), hardened per
# TODOs/phase-2-l2-document-stress-plan.md §4 (defects X6 + X7, fixed 2026-11-02).
#
# Eight rack power-audit memos are ingested as documents before turn 1. Only one
# memo records the UPS that feeds the cold-storage medical biobank chamber, and
# every memo shares the same schema ("Rack power audit — Room N", "UPS unit
# serial", "Load profile").
#
# Fixes applied:
#   X7  Three decoys (rooms 5, 7 and 8) now contain the probe's exact key phrase
#       ("cold-storage medical biobank chamber") while carrying a different UPS
#       serial, so the target must win on semantics alone. Measured pairwise
#       cosine between a memo and its one-digit variant is 0.99968, and at query
#       level a near-miss scored +0.0017 ABOVE the target; the old decoys did not
#       compete because they never mentioned the chamber. Ground truth stays
#       unambiguous: rooms 5/7/8 explicitly disclaim the feed.
#   X6  The scenario had ONE assertion. It now has six: the target serial, the
#       near-miss disclaimer (see X9), a second target in a different memo
#       (build fleet), and an over-disclosure probe for a room that is not in
#       the audit (see X10).
#
#   X9  T3 used to ask "which room is that unit installed in?", a fact derived
#       from the sentence T2 had just answered. The checkpointer answered it from
#       the thread, so `must_retrieve_chunk doc_power_audit_room3` failed while
#       the text assertion passed (run 20261102_151134: room3 absent from the
#       top-5, answer still right). That is the "answer correct + target absent"
#       cell of the measurement grid, i.e. an invalid probe. T3 now asks for the
#       redundant conditioning loop: a fact stated ONLY in the Room 5 memo and
#       never mentioned in any chat turn, so only the store can answer it, and
#       the near-miss disclaimer ("the chamber's own power feed comes from
#       Room 3, not from this room") becomes the discriminator.
#
#  X10  Two problems in one turn (post-cleanup run 20261102_162243):
#       (a) `must_not_contain: "UPS-"` negates a token *class*, so a correct
#           refusal that lists the serials it does have — "Room 1 (UPS-2K19),
#           Room 2 (UPS-4B81), Room 6 (UPS-5H28), Room 8 (UPS-6M90)" — fails it.
#           The answer was right and the assertion was wrong. T5 keeps the rule
#           but is re-labelled: it measures **refusal without over-disclosure**
#           (a real property: the model volunteered four serials nobody asked
#           for; `notes/2026-10-30…` §9 item 6 tracks the same "leak-in-refusal"
#           pattern for `adversarial_forget`).
#       (b) The obvious replacement — `must_contain: "Room 11"` — is vacuous:
#           the probe names Room 11, so every answer, hallucinated or not, echoes
#           it. Design rule **R10**: never assert a token that appears in the
#           user turn. The abstention axis therefore needs a *positive*
#           corpus-exclusive signal, so a scope memo was added
#           (`power_audit_scope`, ticket `FAC-2291`) and T6 asserts it.
#       A deterministic "no match outside an allow-list" rule would express both
#       properties exactly; it is deferred to
#       TODOs/phase-2-l2-document-stress-plan.md §8 (decision 10).
#
# Absence control (run level): `--no-documents` must fail T2-T4 and T6 while T5
# still passes, which is the difference between "memory missing" and "memory
# guessing".
#
# Ablation lever (CLI only, zero harness changes):
#   fail at --top-k 5, pass at --top-k 20  → pure retrieval-cutoff miss
#   inspected via summary.csv / results.json (corpus_chunks, ingested_chunks,
#   retrieved_memories[].chunk_id)

id: document_dilution_01
name: "Document Corpus Dilution (top-k Saturation over Documents)"
description: >
  Eight rack power-audit memos are preloaded as documents. Four of them mention
  the cold-storage medical biobank chamber, but only the Room 3 memo records the
  UPS that actually feeds it (UPS-7C42); the others carry different serials and
  explicitly disclaim the feed. The probes describe the chamber rather than the
  room, so answering requires the target memo to survive the top-k cut-off
  against three lookalikes that share its key phrase. A near-miss probe then
  asks for the redundant conditioning loop, which only the Room 5 memo records
  (and which explicitly disclaims being the power feed); an over-disclosure
  probe asks for a room that is not in the audit (a clean refusal must not dump
  the serials it does have); and a scope-note probe asks for the ticket of the
  pending survey, whose id exists only in the ninth document.
category: document_dilution
metadata:
  kind: "recall"
  amnesia_passes: false
  quality_eligible: true
  expected:
    level_0: "fail"
    level_1: "fail"
    level_2: "partial"
    level_3: "n/a"
    level_4: "n/a"
  difficulty: hard
  stage: "WS-D"
  defects_fixed: ["X6", "X7", "X9", "X10"]
  documents: 9
  document_chunks: 9
  default_top_k: 5
  near_miss_decoys: ["power_audit_room5", "power_audit_room7", "power_audit_room8"]
  assertions_total: 9
  sessions: ["s1", "s2"]
  target_research_question: "P1"
  target_document:
    doc_id: power_audit_room3
    serial: "UPS-7C42"
    room: "Room 3"
    seed_phrase: "frozen biological tissue samples at minus eighty Celsius"
    probe_paraphrase: "cold-storage medical biobank chamber"
  second_target:
    doc_id: power_audit_room2
    serial: "UPS-4B81"
    fact: "hosts the build fleet"
  near_miss_probe:
    doc_id: power_audit_room5
    serial: "UPS-3F57"
    room: "Room 5"
    fact: "redundant conditioning loop for the chamber, explicitly NOT the power feed"
    why: "stated only in this memo and never in a chat turn, so the thread cannot answer it (X9)"
  over_disclosure_probe:
    turn: 5
    property: "refusal without over-disclosure"
    rule: "must_not_contain 'UPS-' fires when the answer lists any serial, real or invented"
    known_limitation: "a correct answer that enumerates documented serials fails by design (X10a); the exact property needs the allow-list rule deferred to §8 decision 10"
  scope_probe:
    turn: 6
    doc_id: power_audit_scope
    token: "FAC-2291"
    property: "the absence of a serial is a documented fact, so the answer is checkable positively (X10b)"
  abstention_probe: "Room 11 is absent from the corpus; any serial in the answer is a hallucination"
  expected_level_0_behavior: "Fails (0%). No document memory; T5 passes trivially (negative assertion)."
  expected_level_1_behavior: "Fails (0%). Documents never enter the thread."
  expected_level_2_behavior: "Depends on top_k and on whether the target memo outranks the three phrase-sharing decoys."

documents:
  - doc_id: power_audit_room1
    content: |
      Rack power audit — Room 1.
      UPS unit serial: UPS-2K19.
      Load profile: steady at 38 percent. Battery string replaced in 2025.
      Notes: general compute only. No storage or cooling dependency.
  - doc_id: power_audit_room2
    content: |
      Rack power audit — Room 2.
      UPS unit serial: UPS-4B81.
      Load profile: steady at 44 percent. Battery string replaced in 2024.
      Notes: hosts the build fleet. Transfers are routine and unapproved.
  - doc_id: power_audit_room3
    content: |
      Rack power audit — Room 3.
      UPS unit serial: UPS-7C42.
      Load profile: steady at 61 percent. Battery string replaced in 2025.
      Notes: this room powers the cold-storage medical biobank chamber that
      holds frozen biological tissue samples at minus eighty Celsius. Any
      transfer of load must be approved by the facilities escalation lead.
  - doc_id: power_audit_room4
    content: |
      Rack power audit — Room 4.
      UPS unit serial: UPS-9D13.
      Load profile: steady at 27 percent. Battery string replaced in 2023.
      Notes: staging cluster. Load may be shed without notice.
  - doc_id: power_audit_room5
    content: |
      Rack power audit — Room 5.
      UPS unit serial: UPS-3F57.
      Load profile: steady at 52 percent. Battery string replaced in 2025.
      Notes: redundant conditioning loop for the cold-storage medical biobank chamber;
      the chamber's own power feed comes from Room 3, not from this room.
      Temperature alarms escalate to the on-call rotation.
  - doc_id: power_audit_room6
    content: |
      Rack power audit — Room 6.
      UPS unit serial: UPS-5H28.
      Load profile: steady at 47 percent. Battery string replaced in 2024.
      Notes: object store front ends. Transfers are coordinated with storage.
  - doc_id: power_audit_room7
    content: |
      Rack power audit — Room 7.
      UPS unit serial: UPS-8J64.
      Load profile: steady at 33 percent. Battery string replaced in 2024.
      Notes: medical imaging archive. Retains studies for seven years; this
      room does not feed the cold-storage medical biobank chamber and has no
      low-temperature storage.
  - doc_id: power_audit_room8
    content: |
      Rack power audit — Room 8.
      UPS unit serial: UPS-6M90.
      Load profile: steady at 18 percent. Battery string replaced in 2023.
      Notes: spares and lab benches. No production dependency; the
      cold-storage medical biobank chamber is out of scope for this room.
  - doc_id: power_audit_scope
    content: |
      Rack power audit — scope note.
      This survey covers Rooms 1 through 8 only. Rooms 9 and above are out of
      scope for this audit and have no UPS serial on file.
      The facilities survey for Room 11 is pending under ticket FAC-2291.

turns:
  - turn_number: 1
    session_id: s1
    role: user
    content: "Hi — I'm auditing facility documentation today. Nothing needed yet."
    assertions: []

  - turn_number: 2
    session_id: s2
    role: user
    probe:
      query_kind: semantic
    content: "Which UPS unit supplies power to the cold-storage medical biobank chamber?"
    assertions:
      - type: must_not_retrieve_chunk
        value: "power_audit_room8"
        case_sensitive: false
      - type: must_contain
        value: "UPS-7C42"
        case_sensitive: false
      - type: must_retrieve_chunk
        value: "doc_power_audit_room3"

  # ── Near-miss probe (X9): a fact stated only in the Room 5 memo ──
  - turn_number: 3
    session_id: s2
    role: user
    probe:
      query_kind: semantic
    content: "Which room provides the redundant conditioning loop for the cold-storage medical biobank chamber?"
    assertions:
      - type: must_contain
        value: "Room 5"
        case_sensitive: false
      - type: must_retrieve_chunk
        value: "doc_power_audit_room5"

  - turn_number: 4
    session_id: s2
    role: user
    probe:
      query_kind: semantic
    content: "Different room: which UPS unit serves the build fleet?"
    assertions:
      - type: must_contain
        value: "UPS-4B81"
        case_sensitive: false
      - type: must_retrieve_chunk
        value: "doc_power_audit_room2"

  # ── Over-disclosure probe (X10a): declining must not dump inventory ──
  - turn_number: 5
    session_id: s2
    role: user
    probe:
      query_kind: lookup
    content: "And the UPS for Room 11 — what serial does that one carry?"
    assertions:
      - type: must_not_contain
        value: "UPS-"
        case_sensitive: true

  # ── Scope-note probe (X10b): the absence is a documented fact ────
  - turn_number: 6
    session_id: s2
    role: user
    probe:
      query_kind: lookup
    content: "Which ticket covers the pending facilities survey for Room 11?"
    assertions:
      - type: must_contain
        value: "FAC-2291"
        case_sensitive: false
      - type: must_retrieve_chunk
        value: "doc_power_audit_scope"
