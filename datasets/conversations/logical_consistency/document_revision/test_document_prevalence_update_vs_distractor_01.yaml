# ─────────────────────────────────────────────────────────────────
# test_document_prevalence_update_vs_distractor_01.yaml
# Prevalence: a conversation update supersedes a document fact, while
# near-miss distractors must NOT invalidate other document facts.
#
# Corpus: d16_corpus_060 reused VERBATIM (committed D16 corpus):
#   LOOP-420 -> corpus_000 -> YKX-HMD0-7872  (fact to be superseded)
#   LOOP-969 -> corpus_045 -> BQR-485R-6500  (near-miss: same shape, other entity)
#   RACK-923 -> corpus_007 -> UVA-046I-7504  (untouched control)
#
# Design (2x2: {superseded by chat vs not-superseded} x {same vs fresh session}):
#   T1  baseline: the document value is the pre-update truth + pin corpus_000.
#   T2  supersession IN THE CONVERSATION (role=user, source=chat), not a
#       document attachment: QZX-7P4K-1180 exists in NO document, so it can
#       reach s2/s3 only through the cross-thread episodic store.
#   T3  distractor A: unconfirmed rumor that sibling loop LOOP-969 changed
#       (it did not) -> its document value must survive.
#   T4  distractor B: same entity, adjacent attribute (LOOP-420 maintenance
#       window) -> must not re-open/invalidate the calibration code.
#   T5  superseded, same session: lenient must_contain NEW (in-context update;
#       even L1 passes, isolating the cross-thread capability below).
#   T6  not-superseded, same session: document value + no contamination.
#   T7  superseded, FRESH session: LENIENT by design (rule R1). A correct answer
#       may say "the documentation said X, but it was updated to Y", so there is
#       deliberately NO must_not_contain on the stale value here. It pins the
#       chat update chunk ep_s1_t2 (graph turn numbering counts human turns; s1
#       has no system_event, so T2 -> ep_s1_t2 exactly).
#   T8  not-superseded, fresh session: the document fact prevails cross-thread.
#   T9  untouched control (RACK-923): global integrity.
#   T10 ISOLATED s3 strict probe: the prompt explicitly forbids historical
#       values, so must_not_contain on the stale code is FAIR here — this is the
#       "does not present the old code as current" check the lenient T7 cannot
#       make without penalising a legitimate historical mention. s3 is its own
#       thread so T7's answer cannot anchor it (pattern: entity_binding_01 R1).
#
# Causal argument: QZX-7P4K-1180 is chat-exclusive (asserted offline by
# tests/test_prevalence_scenario.py), so must_contain NEW in a fresh session
# can only be satisfied by the episodic chat store.
# ─────────────────────────────────────────────────────────────────
id: document_prevalence_update_vs_distractor_01
name: 'Document Prevalence: Conversation Update vs. Near-Miss Distractors'
description: 'Prevalence test over the 60-document D16 corpus (d16_corpus_060). Turn 1 probes the calibration code of cooling loop LOOP-420, which exists only in corpus_000 (YKX-HMD0-7872). Turn 2 reports, through the conversation, that the code was rotated to QZX-7P4K-1180 — a value present in no document, so it can reach a later session only through the cross-thread episodic store. Turns 3-4 add distractors: an unconfirmed rumor that sibling loop LOOP-969 ''might have changed'' (it did not) and a same-entity scheduling change (LOOP-420''s maintenance window) that does not touch the code. Turns 5-6 re-probe both loops in-session; turns 7-9 re-probe them in a fresh session; turn 10 is an isolated strict probe that forbids historical values so the stale code can be graded absent. Prevalence passes only if the superseded value is replaced by the conversation update (LOOP-420 -> QZX-7P4K-1180) while the merely-similar, non-confirming distractors leave the document facts intact (LOOP-969 ->
  BQR-485R-6500, RACK-923 -> UVA-046I-7504).'
category: document_revision
metadata:
  difficulty: hard
  stage: WS-D / prevalence
  target_research_question: P2
  corpus_dir: d16_corpus_060
  corpus_docs: 60
  chunk_size: 1200
  chunk_size_ablation: 600
  default_top_k: 8
  sessions:
  - s1
  - s2
  - s3
  updated_fact:
    entity: LOOP-420
    doc_id: corpus_000
    superseded_value: YKX-HMD0-7872
    superseding_value: QZX-7P4K-1180
    superseded_by: user turn 2 (source=chat)
  preserved_document_facts:
  - entity: LOOP-969
    doc_id: corpus_045
    value: BQR-485R-6500
    distractor: unconfirmed rumor of change (turn 3)
  - entity: RACK-923
    doc_id: corpus_007
    value: UVA-046I-7504
    distractor: none (untouched control)
  distractor_same_entity:
    entity: LOOP-420
    turn: 4
    attribute: maintenance window -> Q4
    must_not_invalidate:
    - YKX-HMD0-7872
    - QZX-7P4K-1180
  prevalence_matrix:
  - info_state: superseded by chat
    session: s1
    turn: 5
    expect: QZX-7P4K-1180
  - info_state: superseded by chat
    session: s2
    turn: 7
    expect: QZX-7P4K-1180 (cross-thread, lenient)
  - info_state: not superseded (distractor)
    session: s1
    turn: 6
    expect: BQR-485R-6500
  - info_state: not superseded (distractor)
    session: s2
    turn: 8
    expect: BQR-485R-6500 (cross-thread)
  - info_state: superseded by chat (strict)
    session: s3
    turn: 10
    expect: QZX-7P4K-1180 with stale absent
  expected_level_0_behavior: 'Fails (0%): no memory; T1 and every document probe fail.'
  expected_level_1_behavior: Only T5 passes (the update is in-session history). T1/T6/T8 fail (no document store); T7/T10 fail (fresh threads, no cross-thread memory).
  expected_level_2_behavior: T1/T5/T6/T8/T9 pass; T7 passes iff the chat update chunk (ep_s1_t2 or its echo) reaches top_k; T10 passes if the chat-exclusive new value survives cross-thread.
