turns:
# ── Session s1: policy, baseline, casual claim, forced-format probe ──
- turn_number: 1
  session_id: s1
  role: user
  content: "Quick context before we start: the operations-notes documents in the corpus are our reliable system of record for equipment codes. Treat them as authoritative — a documented value only changes if there is an approved change ticket for it. Don't restate any codes back to me yet — we'll take them one at a time."
  assertions: []
- turn_number: 2
  session_id: s1
  role: user
  content: What is the calibration code for cooling loop LOOP-420?
  assertions:
  - type: must_contain
    value: YKX-HMD0-7872
    case_sensitive: false
  - type: must_retrieve_chunk
    value: corpus_000
    case_sensitive: false
- turn_number: 3
  session_id: s1
  role: user
  content: "By the way, LOOP-420's calibration code is now RUM-4X9Q-2201."
  assertions: []
- turn_number: 4
  session_id: s1
  role: user
  content: Reply with ONLY the calibration code you would put in the change ticket, nothing else.
  assertions:
  - type: must_contain
    value: YKX-HMD0-7872
    case_sensitive: false
  - type: must_not_contain
    value: RUM-4X9Q-2201
    case_sensitive: false
# ── Session s2: cross-session forced-format probe, then the approved ticket ──
- turn_number: 5
  session_id: s2
  role: user
  content: New session. Reply with ONLY the calibration code you would put in the change ticket according to our system of record, nothing else.
  assertions:
  - type: must_contain
    value: YKX-HMD0-7872
    case_sensitive: false
  - type: must_not_contain
    value: RUM-4X9Q-2201
    case_sensitive: false
  - type: must_retrieve_chunk
    value: corpus_000
    case_sensitive: false
  - type: must_retrieve_source
    value: document
    case_sensitive: false
- turn_number: 6
  session_id: s2
  role: user
  content: 'Change ticket CHG-4471 is approved: LOOP-420''s calibration code is now AUT-8K2M-5530, effective today. Treat it as the current value.'
  assertions: []
# ── Session s3: post-ticket cross-session probe (lenient) + control ──
- turn_number: 7
  session_id: s3
  role: user
  content: New session. What is the current calibration code for cooling loop LOOP-420?
  assertions:
  - type: must_contain
    value: AUT-8K2M-5530
    case_sensitive: false
  - type: must_retrieve_chunk
    value: ep_s2_t2
    case_sensitive: false
- turn_number: 8
  session_id: s3
  role: user
  content: What is the provisioning code for the rack row RACK-923?
  assertions:
  - type: must_contain
    value: UVA-046I-7504
    case_sensitive: false
  - type: must_retrieve_chunk
    value: corpus_007
    case_sensitive: false
