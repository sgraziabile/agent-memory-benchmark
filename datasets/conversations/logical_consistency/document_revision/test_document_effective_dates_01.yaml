# ─────────────────────────────────────────────────────────────────
# test_document_effective_dates_01.yaml — Effective Dates / Temporal Validity
# ─────────────────────────────────────────────────────────────────
# Corpus: d16_corpus_060 reused VERBATIM (committed D16 corpus, 60 docs):
#   LOOP-420 -> corpus_000 -> YKX-HMD0-7872  (integrity anchor)
#   LOOP-969 -> corpus_045 -> BQR-485R-6500  (integrity anchor)
#   RACK-923 -> corpus_007 -> UVA-046I-7504  (untouched control probe, T4)
# Reuse implies NO re-embedding: the text is byte-identical, so the on-disk
# embedding cache (chunk_size=1200, 376 chunks) stays warm. The ONLY new
# document is the inline revision history below (1 chunk) -> 61 documents.
#
# Effective-dates semantics under test:
#   ONE document lists THREE dated revisions of the same calibration code, so
#   the correct answer is a function of (document, reference date) and the
#   newest revision is NOT the answer for every date. PUMP-88 appears in no
#   corpus document (asserted offline by tests/test_effective_dates_scenario.py):
#     2025-01-01 -> P88-ALPHA-1000
#     2026-09-14 -> P88-BETA-2000
#     2027-01-01 -> P88-GAMMA-3000
#   The dated revisions live in a DOCUMENT, never in a chat turn: chat-only
#   dated statements would measure chat temporal memory, not the validity
#   semantics of document content.
#
# Design — reference-date sweep over ONE document (three dates, three correct
# answers). Each probe owns its own session so no earlier answer can anchor the
# next probe in-context, and each probe forces a format ("Reply with ONLY ...")
# so the must_not_contain guards on the other two revisions are fair (rule R1).
#   T1 s1 reference date 2026-08-01 -> P88-ALPHA-1000: the newest revision is
#      not effective yet, so answering with "the newest" fails.
#   T2 s2 reference date 2026-10-15 -> P88-BETA-2000: ALPHA is history and
#      GAMMA is not effective yet, so echoing T1's answer fails.
#   T3 s3 reference date 2027-03-01 -> P88-GAMMA-3000: echoing T1/T2 fails.
#   T4 s3 untouched control from the corpus (RACK-923 -> UVA-046I-7504), so a
#      failure in T1-T3 cannot be blamed on corpus-wide retrieval collapse.
# Every probe pins its gold chunk (revisions_pump88; corpus_007 for T4), so
# "did the document arrive?" is separable from "picked the wrong revision"
# (see expected_level_2_behavior).
#
# Ablation contract:
#   L0 -> 0%: no memory; the revision document is never retrieved.
#   L1 -> fails every date probe: documents are never ingested, and each probe
#         opens a fresh thread, so nothing carries the effective dates.
#   L2 -> passes when doc_revisions_pump88 is retrieved AND the document's
#         effective dates are applied to the probe's reference date. Failures
#         split into (a) miss = doc not retrieved (the chunk pin fails) and
#         (b) wrong revision = newest/echoed value chosen instead of the
#         date-effective one (the must_not_contain guards fire).
#
# Run with a NON-thinking model and baseline_react (strict_epistemic is
# unsuitable: its rule 5 — treat the user's most recent statement as
# authoritative — biases toward recency):
#   python run.py --level 2 --scenario document_effective_dates_01 \
#     --model deepseek-v4.1-flash --backend vector \
#     --embedding-model qwen3-embedding-0.6b --chunk-size 1200 --top-k 8 \
#     --embed-cache outputs/embed_cache --prompt baseline_react
# ─────────────────────────────────────────────────────────────────

id: document_effective_dates_01
name: 'Document Effective Dates: Reference-Date Sweep over One Revision History'
description: >
  Effective-dates / temporal-validity test over the 60-document D16 corpus
  (d16_corpus_060) plus one inline revision-history document. The document lists
  three dated revisions of PUMP-88's calibration code (2025-01-01 ->
  P88-ALPHA-1000, 2026-09-14 -> P88-BETA-2000, 2027-01-01 -> P88-GAMMA-3000),
  and no corpus document mentions PUMP-88. Three probes ask which code is in
  effect "as of" three different reference dates, each in its own session and
  each forcing a format-only answer: 2026-08-01 (ALPHA), 2026-10-15 (BETA) and
  2027-03-01 (GAMMA). A model that just picks the newest revision fails T1; a
  model that echoes a previous session's answer fails T2/T3; only applying the
  document's effective dates to the probe's reference date passes all three.
  Turn 4 is an untouched control from the corpus (RACK-923 -> UVA-046I-7504),
  and every probe pins its gold chunk so a retrieval miss is distinguishable
  from a wrong-revision choice.
category: document_revision
metadata:
  difficulty: hard
  stage: "prevalence/effective-dates"
  target_research_question: "P2"
  corpus_dir: d16_corpus_060
  corpus_docs: 61
  chunk_size: 1200
  default_top_k: 8
  sessions: ["s1", "s2", "s3"]
  effective_dates_doc: revisions_pump88
  embedding_model: qwen3-embedding-0.6b
  revisions: [{effective: "2025-01-01", value: "P88-ALPHA-1000"}, {effective: "2026-09-14", value: "P88-BETA-2000"}, {effective: "2027-01-01", value: "P88-GAMMA-3000"}]
  reference_dates:
    t1: "2026-08-01"
    t2: "2026-10-15"
    t3: "2027-03-01"
  control_entity:
    token: UVA-046I-7504
    doc_id: corpus_007
    entity: RACK-923
  headline_metric: probe_verdict
  probe_verdict_rule: "A probe counts as correct only when its must_contain value is present AND its gold chunk (must_retrieve_chunk) is inside retrieved_memories. must_not_contain guards pass for free on a refusal (a memory-less control scores 6/14 assertions on this scenario), so the assertion pass-rate is a secondary comparability figure and no probe is ever graded by guards alone."
  wall_clock_dependence: "Which probe discriminates depends on the run date, not only on this file: on 2026-11-06 the code in force is P88-BETA-2000, so T2's correct answer coincides with today's answer and only T1 (a past date whose answer differs) separates 'apply the reference date' from 'answer for today'. Record the run date with any result derived from this scenario and never compare probe verdicts across dates."
  expected_level_0_behavior: "0%: no memory; the revision doc is never retrieved."
  expected_level_1_behavior: "Fails all date probes (fresh threads, no document store)."
  expected_level_2_behavior: "Passes if the revision doc is retrieved and the effective date is applied; failures split into (a) miss = doc not retrieved (pin fails) and (b) wrong revision = picked newest/echo instead of the date-effective one."

