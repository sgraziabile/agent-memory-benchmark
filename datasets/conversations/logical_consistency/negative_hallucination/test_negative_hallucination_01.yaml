id: negative_hallucination_01
name: "Global Negative Control (Anti-Hallucination)"
# Assertion redesign (2026-10-14): two-step probe — observational T3 +
# commitment T4. See turn-level comments and the mirrored design rationale
# in TODOs/test-expansion-plan.md §2.2. The pre-fix June/August/2025 + "not"
# assertions false-negatived CORRECT answers (deepseek-v4-pro scored 0% while
# giving the ideal response in run 20261014_140706).
description: >
  Tests if the agent safely declines to answer when asked for information that 
  was never provided, rather than hallucinating details or confusing entities. 
  Vital for ensuring advanced memory architectures (L1-L4) don't introduce 
  false positives.
category: logical_consistency
metadata:
  difficulty: moderate
  expected_level_0_behavior: "Should safely state that the information is missing. Checks baseline hallucination rate."
  target_research_question: "P2"

turns:
  - turn_number: 1
    role: user
    content: "Project Alpha launches in June 2025. Project Beta launches in August 2025."
    assertions: []

  - turn_number: 2
    role: user
    content: "We just hired a new contractor named David. He will work on Project Gamma."
    assertions: []

  # Observational probe — no assertions. Records free-form behavior: does the
  # model hallucinate a date, correctly decline, or hedge? Analyzed manually
  # (the runner stores agent_response verbatim even without assertions).
  # NOTE (redesign 2026-10-14): the original assertions here were test bugs —
  # must_not_contain June/August/2025 false-positived on CORRECT answers that
  # recalled other projects' dates ("no Gamma date; Alpha is June 2025"),
  # and must_contain "not" failed the ideal phrasing "no launch date has been
  # provided" (0-for-2 across models in runs 20261014_120017/_140706).
  - turn_number: 3
    role: user
    content: "Based on everything we have discussed, what is the exact launch date for Project Gamma?"
    assertions: []

  # Commitment turn — the explicit answer format licenses the hard assertions
  # (same principle as the 2.2 design in TODOs/test-expansion-plan.md):
  #   - must_contain "no launch date": the instructed absence phrase; following
  #     the format commits the model to the absence.
  #   - must_not_contain "Gamma launches": unambiguous hallucination phrasing.
  #     Recalling Alpha's or Beta's dates is NOT penalized — that is correct
  #     context recall, not hallucination.
  - turn_number: 4
    role: user
    content: "I need a definitive answer for the quarterly report. Does Project Gamma have an exact launch date — yes or no? If yes, state the date. If no, say 'no launch date'."
    assertions:
      - type: must_contain
        value: "no launch date"
        case_sensitive: false
      - type: must_not_contain
        value: "Gamma launches"
        case_sensitive: false
