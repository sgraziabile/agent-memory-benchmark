# ─────────────────────────────────────────────────────────────────
# test_document_needle_01.yaml — Needle in an Ingested Document
# ─────────────────────────────────────────────────────────────────
# Plan WS-D (TODOs/phase-2-l2-completion-plan.md §4). The access
# policy is ingested as a DOCUMENT (source="document", session
# "corpus") before turn 1, never as a chat turn. Session s2 opens a
# fresh thread, so a checkpointer (L1) cannot answer; only a
# cross-thread store with document chunks (L2) can.
#
# Ablation contract:
#   L0 → fails (no memory at all)
#   L1 → fails (documents live in the long-term store, not the thread)
#   L2 → passes (policy chunk retrieved by similarity)
# ─────────────────────────────────────────────────────────────────

id: document_needle_01
name: "Needle in an Ingested Document (Document Memory Gate)"
description: >
  The Northwind access policy is ingested into long-term memory as a
  document before the conversation starts. Session s1 is ordinary
  chit-chat that never mentions the policy. Session s2 is a new thread
  whose probes ask for two facts that exist only inside the document
  (the break-glass account identifier and the role/facility that
  releases it). Passing requires the harness to ingest documents into
  the memory backend and the agent to retrieve them cross-thread.
category: document_needle
metadata:
  difficulty: moderate
  stage: "WS-D"
  documents: ["policy_v1.md"]
  document_chars: 3160
  sessions: ["s1", "s2"]
  seeded_facts: 2
  target_research_question: "P1"
  probe_turns:
    turn_3: "lexical_anchor (break-glass) inside document section 5"
    turn_4: "compositional (section 2 roles table + section 5 custody)"
  expected_level_0_behavior: "Fails (0%). No memory; cannot know the document exists."
  expected_level_1_behavior: "Fails (0%). Documents live in the cross-thread store, not the checkpointer thread."
  expected_level_2_behavior: "Passes (100%). Both probes retrieve the policy chunks from the episodic store."

documents:
  - doc_id: policy_v1
    path: policy_v1.md
    metadata:
      title: "Northwind Datacenter Access Policy (Revision 1)"

turns:
  # ── Session s1: unrelated chit-chat, no policy mention ──────────
  - turn_number: 1
    session_id: s1
    role: user
    content: "Hi! I'm going to use you as my assistant for the platform team this week."
    assertions: []

  - turn_number: 2
    session_id: s1
    role: user
    content: "In two sentences, what is the difference between a rolling restart and a blue-green deployment?"
    assertions: []

  # ── Session s2: new thread, document-only facts ─────────────────
  - turn_number: 3
    session_id: s2
    role: user
    content: "I'm back in a new working session. According to our access policy, what is the break-glass emergency account identifier?"
    assertions:
      - type: must_contain
        value: "iris-breakglass-77"
        case_sensitive: false
      - type: must_retrieve_chunk
        value: "doc_policy_v1"

  - turn_number: 4
    session_id: s2
    role: user
    content: "Which role is allowed to release that break-glass credential, and at which facility is it sealed?"
    assertions:
      - type: must_contain
        value: "incident commander"
        case_sensitive: false
      - type: must_contain
        value: "Rosario"
        case_sensitive: false
