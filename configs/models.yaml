# ─────────────────────────────────────────────────────────────────
# models.yaml — Unified Multi-Provider Model Registry
# ─────────────────────────────────────────────────────────────────
# Each entry maps a friendly model_id to its provider and model name.
# Optional parameters like 'timeout' (seconds), 'max_retries',
# and 'max_tokens' are forwarded to the underlying model constructor.
#
# 'max_tokens' is held CONSTANT at 2048 across all models for controlled
# comparison. 2048 is a deliberate NON-BINDING safety rail: reasoning-hybrid
# models (GLM, gpt-oss, ...) spend this budget on chain-of-thought BEFORE
# emitting visible content, so a cap that binds produces truncated/blank
# responses that measure the budget, not memory (observed with 300 on
# 2026-10-09: glm-5.3-flash exhausted 300 tokens reasoning on 2 turns of
# explicit_forget_01). Runtime guard: finish_reason == "length" is flagged
# as an error turn by the runner, so truncation can never masquerade as a
# model failure. Do NOT remove the key — omitting it makes each provider
# apply its own default, which would silently break the constant.
#
# Environment variables required per provider:
#   google    → GOOGLE_API_KEY
#   openai    → OPENAI_API_KEY
#   anthropic → ANTHROPIC_API_KEY
#   nanogpt   → NANOGPT_API_KEY (OpenAI-compatible gateway — https://api.nano-gpt.com)
#   ollama    → OLLAMA_BASE_URL (optional, defaults to http://localhost:11434)
#
# ── Subscription policy ─────────────────────────────────────────
# ALL registered models are NanoGPT subscription models, verified
# `subscription.included: true` against the live catalog (2026-10-09):
#   GET https://api.nano-gpt.com/api/v1/models?detailed=true
#   → 632 models in catalog, 299 subscription-included.
# "1x/2x" in descriptions = inputTokenMultiplier (2x burns input-token
# quota twice as fast). NO anthropic/* and NO google/* models are
# subscription-included — do not register them. Re-verify before every
# big sweep: availability changes frequently.
# ─────────────────────────────────────────────────────────────────

models:
  # ── Frontier tier (maximum capability, 1x quota) ──────────────
  qwen3-235b:
    provider: nanogpt
    model_name: qwen/qwen3-235b-a22b
    tier: frontier
    timeout: 60.0
    max_retries: 2
    max_tokens: 2048
    description: "Qwen3 235B-A22B — largest subscription-included model (1x input tokens)"

  kimi-k2.6:
    provider: nanogpt
    model_name: moonshotai/kimi-k2.6
    tier: frontier
    timeout: 60.0
    max_retries: 2
    max_tokens: 2048
    description: "Moonshot Kimi K2.6 — frontier open MoE (1x input tokens)"

  # ── Efficient tier (fast workhorses, 1x quota) ────────────────
  glm-5.3-flash:
    provider: nanogpt
    model_name: z-ai/glm-5.3-flash
    tier: efficient
    timeout: 60.0
    max_retries: 2
    max_tokens: 2048
    description: "Z.AI GLM 5.3 Flash — efficient tier (1x input tokens)"

  deepseek-v4-flash:
    provider: nanogpt
    model_name: deepseek/deepseek-v4-flash
    tier: efficient
    timeout: 60.0
    max_retries: 2
    max_tokens: 2048
    description: "DeepSeek V4 Flash — efficient tier (1x input tokens)"

  # ── Open-large tier (big open models) ─────────────────────────
  gpt-oss-120b:
    provider: nanogpt
    model_name: openai/gpt-oss-120b
    tier: open-large
    timeout: 60.0
    max_retries: 2
    max_tokens: 2048
    description: "OpenAI gpt-oss-120b — open 120B MoE (1x input tokens)"

  deepseek-v4-pro:
    provider: nanogpt
    model_name: deepseek/deepseek-v4-pro
    tier: open-large
    timeout: 60.0
    max_retries: 2
    max_tokens: 2048
    description: "DeepSeek V4 Pro — strongest included DeepSeek (2x input tokens — use sparingly)"

  # ── Open-mid / open-small tiers ───────────────────────────────
  qwen3.6-27b:
    provider: nanogpt
    model_name: qwen/qwen3.6-27b
    tier: open-mid
    timeout: 60.0
    max_retries: 2
    max_tokens: 2048
    description: "Qwen 3.6 27B — mid-size open model (1x input tokens)"

  gpt-oss-20b:
    provider: nanogpt
    model_name: openai/gpt-oss-20b
    tier: open-small
    timeout: 60.0
    max_retries: 2
    max_tokens: 2048
    description: "OpenAI gpt-oss-20b — small open model (1x input tokens)"

# ─────────────────────────────────────────────────────────────────
# LLM-as-a-Judge — for Level 3 (planned; not yet consumed by the
# runner, kept here as the documented, subscription-verified choice).
# Judge volume is low, so a 2x multiplier is acceptable for a stronger
# cross-family judge (e.g. deepseek/deepseek-v4-pro). Caveat: the
# current pick is also in the tested set — self-preference bias is
# possible; prefer a cross-family judge in the final methodology.
# ─────────────────────────────────────────────────────────────────
judge:
  id: qwen/qwen3-235b-a22b
  temperature: 0

# ─────────────────────────────────────────────────────────────────
# embeddings — Embedding model registry for Level 2+ episodic memory
# (TODOs/phase-2-l2-plan.md §3.2).
#
# 'dims' MUST be declared explicitly per model: LangGraph's InMemoryStore
# vector index requires the exact dimensionality at construction time —
# never hardcode 1024 vs. 4096.
#
# The API-served entries (qwen3-embedding-8b primary, bge backup) go
# through NanoGPT's OpenAI-compatible /api/v1/embeddings endpoint. API over
# local execution is deliberate for the 8B primary: the dev machine has no
# CUDA GPU, so local 8B embedding inference during chunk ingestion would
# bottleneck on CPU and distort P3 latency metrics. The 0.6B local Ollama
# entry is the deliberate budget/latency trade-off: small enough to be
# CPU-viable during ingestion, but its embedding latency is that of local
# CPU inference, not the 8B API — keep qwen3-embedding-8b as the primary
# for latency-sensitive sweeps and use the 0.6B model only when the
# NanoGPT subscription cannot serve embeddings.
#
# ⚠ Verify subscription inclusion (NanoGPT-served entries only) against
# the live catalog before every sweep (same policy as chat models):
#   GET https://api.nano-gpt.com/api/v1/models?detailed=true
# ─────────────────────────────────────────────────────────────────
embeddings:
  qwen3-embedding-8b:
    provider: nanogpt
    model_name: qwen/qwen3-embedding-8b
    dims: 4096
    timeout: 60.0
    max_retries: 2
    description: "Qwen3-Embedding-8B — primary embedding model (4096 dims, 32k-token context; subscription availability must be verified pre-sweep)"

  bge-large-en-v1.5:
    provider: nanogpt
    model_name: baai/bge-large-en-v1.5
    dims: 1024
    timeout: 60.0
    max_retries: 2
    description: "BAAI bge-large-en-v1.5 — backup/comparison embedding model (1024 dims, 512-token context; subscription availability must be verified pre-sweep)"

  qwen3-embedding-0.6b:
    provider: ollama
    model_name: qwen3-embedding:0.6b
    dims: 1024
    timeout: 60.0
    max_retries: 2
    description: "Qwen3-Embedding-0.6B — local Ollama embedding model (1024 dims; CPU-viable fallback for when the NanoGPT subscription cannot serve embeddings; pull with `ollama pull qwen3-embedding:0.6b`)"
