# ─────────────────────────────────────────────────────────────────
# models.yaml — Unified Multi-Provider Model Registry
# ─────────────────────────────────────────────────────────────────
# Each entry maps a friendly model_id to its provider and model name.
# Optional parameters like 'timeout' (seconds), 'max_retries',
# and 'max_tokens' are forwarded to the underlying model constructor.
#
# Environment variables required per provider:
#   google    → GOOGLE_API_KEY
#   openai    → OPENAI_API_KEY
#   anthropic → ANTHROPIC_API_KEY
#   nanogpt   → NANOGPT_API_KEY (OpenAI-compatible gateway — https://api.nano-gpt.com)
#
# ── Subscription policy ─────────────────────────────────────────
# ALL registered models are NanoGPT subscription models, verified
# `subscription.included: true` against the live catalog (2026-10-09):
#   GET https://api.nano-gpt.com/api/v1/models?detailed=true
#   → 632 models in catalog, 299 subscription-included.
# "1x/2x" in descriptions = inputTokenMultiplier (2x burns input-token
# quota twice as fast). NO anthropic/* and NO google/* models are
# subscription-included — do not register them. Re-verify before every
# big sweep: availability changes frequently.
# ─────────────────────────────────────────────────────────────────

models:
  # ── Frontier tier (maximum capability, 1x quota) ──────────────
  qwen3-235b:
    provider: nanogpt
    model_name: qwen/qwen3-235b-a22b
    tier: frontier
    timeout: 60.0
    max_retries: 2
    max_tokens: 300
    description: "Qwen3 235B-A22B — largest subscription-included model (1x input tokens)"

  kimi-k2.6:
    provider: nanogpt
    model_name: moonshotai/kimi-k2.6
    tier: frontier
    timeout: 60.0
    max_retries: 2
    max_tokens: 300
    description: "Moonshot Kimi K2.6 — frontier open MoE (1x input tokens)"

  # ── Efficient tier (fast workhorses, 1x quota) ────────────────
  glm-5.3-flash:
    provider: nanogpt
    model_name: z-ai/glm-5.3-flash
    tier: efficient
    timeout: 60.0
    max_retries: 2
    max_tokens: 300
    description: "Z.AI GLM 5.3 Flash — efficient tier (1x input tokens)"

  deepseek-v4-flash:
    provider: nanogpt
    model_name: deepseek/deepseek-v4-flash
    tier: efficient
    timeout: 60.0
    max_retries: 2
    max_tokens: 300
    description: "DeepSeek V4 Flash — efficient tier (1x input tokens)"

  # ── Open-large tier (big open models) ─────────────────────────
  gpt-oss-120b:
    provider: nanogpt
    model_name: openai/gpt-oss-120b
    tier: open-large
    timeout: 60.0
    max_retries: 2
    max_tokens: 300
    description: "OpenAI gpt-oss-120b — open 120B MoE (1x input tokens)"

  deepseek-v4-pro:
    provider: nanogpt
    model_name: deepseek/deepseek-v4-pro
    tier: open-large
    timeout: 60.0
    max_retries: 2
    max_tokens: 300
    description: "DeepSeek V4 Pro — strongest included DeepSeek (2x input tokens — use sparingly)"

  # ── Open-mid / open-small tiers ───────────────────────────────
  qwen3.6-27b:
    provider: nanogpt
    model_name: qwen/qwen3.6-27b
    tier: open-mid
    timeout: 60.0
    max_retries: 2
    max_tokens: 300
    description: "Qwen 3.6 27B — mid-size open model (1x input tokens)"

  gpt-oss-20b:
    provider: nanogpt
    model_name: openai/gpt-oss-20b
    tier: open-small
    timeout: 60.0
    max_retries: 2
    max_tokens: 300
    description: "OpenAI gpt-oss-20b — small open model (1x input tokens)"

# ─────────────────────────────────────────────────────────────────
# LLM-as-a-Judge — for Level 3 (planned; not yet consumed by the
# runner, kept here as the documented, subscription-verified choice).
# Judge volume is low, so a 2x multiplier is acceptable for a stronger
# cross-family judge (e.g. deepseek/deepseek-v4-pro). Caveat: the
# current pick is also in the tested set — self-preference bias is
# possible; prefer a cross-family judge in the final methodology.
# ─────────────────────────────────────────────────────────────────
judge:
  id: qwen/qwen3-235b-a22b
  temperature: 0
