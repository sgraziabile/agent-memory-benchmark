# ─────────────────────────────────────────────────────────────────
# LLM-as-a-Judge — for Level 3 (planned; not yet consumed by the
# runner, kept here as the documented, subscription-verified choice).
# Judge volume is low, so a 2x multiplier is acceptable for a stronger
# cross-family judge (e.g. deepseek/deepseek-v4-pro). Caveat: the
# current pick is also in the tested set — self-preference bias is
# possible; prefer a cross-family judge in the final methodology.
# ─────────────────────────────────────────────────────────────────
judge:
  id: qwen/qwen3-235b-a22b
  temperature: 0

# ─────────────────────────────────────────────────────────────────
# embeddings — Embedding model registry for Level 2+ episodic memory
# (TODOs/phase-2-l2-plan.md §3.2).
#
# 'dims' MUST be declared explicitly per model: LangGraph's InMemoryStore
# vector index requires the exact dimensionality at construction time —
# never hardcode 1024 vs. 4096.
#
# The API-served entries (qwen3-embedding-8b primary, bge backup) go
# through NanoGPT's OpenAI-compatible /api/v1/embeddings endpoint. API over
# local execution is deliberate for the 8B primary: the dev machine has no
# CUDA GPU, so local 8B embedding inference during chunk ingestion would
# bottleneck on CPU and distort P3 latency metrics. The 0.6B local Ollama
# entry is the deliberate budget/latency trade-off: small enough to be
# CPU-viable during ingestion, but its embedding latency is that of local
# CPU inference, not the 8B API — keep qwen3-embedding-8b as the primary
# for latency-sensitive sweeps and use the 0.6B model only when the
# NanoGPT subscription cannot serve embeddings.
#
# ⚠ Verify subscription inclusion (NanoGPT-served entries only) against
# the live catalog before every sweep (same policy as chat models):
#   GET https://api.nano-gpt.com/api/v1/models?detailed=true
# ─────────────────────────────────────────────────────────────────
embeddings:
  qwen3-embedding-8b:
    provider: nanogpt
    model_name: qwen/qwen3-embedding-8b
    dims: 4096
    timeout: 60.0
    max_retries: 2
    description: "Qwen3-Embedding-8B — primary embedding model (4096 dims, 32k-token context; subscription availability must be verified pre-sweep)"

  bge-large-en-v1.5:
    provider: nanogpt
    model_name: baai/bge-large-en-v1.5
    dims: 1024
    timeout: 60.0
    max_retries: 2
    description: "BAAI bge-large-en-v1.5 — backup/comparison embedding model (1024 dims, 512-token context; subscription availability must be verified pre-sweep)"

  qwen3-embedding-0.6b:
    provider: ollama
    model_name: qwen3-embedding:0.6b
    dims: 1024
    # Batched ingestion sends up to --embed-batch-size chunks per request; on
    # this CPU a 16-chunk window takes ~35-44 s, so 60 s left no headroom and
    # a single slow window aborted a 14-minute ingestion (2026-11-04).
    # Timed-out windows are halved and retried (vector.py), and 240 s keeps a
    # full window comfortably inside the ceiling.
    timeout: 240.0
    max_retries: 2
    description: "Qwen3-Embedding-0.6B — local Ollama embedding model (1024 dims; CPU-viable fallback for when the NanoGPT subscription cannot serve embeddings; pull with `ollama pull qwen3-embedding:0.6b`)"
